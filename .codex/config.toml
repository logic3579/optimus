[mcp_servers.mem0]
# Mem0 is consumed through its hosted Streamable HTTP endpoint. Callers use
# user_id = "logic" by default, as documented in AGENTS.md and CLAUDE.md.
url = "https://mcp.mem0.ai/mcp"
bearer_token_env_var = "MEM0_API_KEY"
startup_timeout_sec = 15
tool_timeout_sec = 60
default_tools_approval_mode = "auto"  # auto / prompt / approve
