name: ci
on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: optimus-be/go.sum

      - name: go mod download
        working-directory: optimus-be
        run: go mod download

      - name: install tools
        working-directory: optimus-be
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
          go install github.com/swaggo/swag/cmd/swag@v1.16.4
          go install github.com/securego/gosec/v2/cmd/gosec@v2.22.7

      - name: lint
        working-directory: optimus-be
        run: golangci-lint run --timeout 5m

      - name: swagger-diff
        working-directory: optimus-be
        run: make swagger-diff

      - name: perm-check
        working-directory: optimus-be
        run: make perm-check

      - name: gosec
        working-directory: optimus-be
        run: gosec -severity medium -confidence medium -quiet ./...

  backend-unit:
    name: Backend unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: optimus-be/go.sum

      - name: go mod download
        working-directory: optimus-be
        run: go mod download

      - name: unit tests
        working-directory: optimus-be
        run: go test ./... -race -cover

  backend-dbtest:
    name: Backend database tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: optimus-be/go.sum

      - name: go mod download
        working-directory: optimus-be
        run: go mod download

      - name: dbtest (with real Postgres via dockertest)
        working-directory: optimus-be
        run: go test ./... -tags=dbtest -race -count=1

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: optimus-fe
    steps:
      - uses: actions/checkout@v4
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.x
      - name: Install
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: i18n keys
        run: bun run i18n:check
      - name: Unit tests
        run: bun run test
      - name: Build
        run: bun run build

  docker-build:
    name: Docker build (${{ matrix.image }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [backend-quality, backend-unit, backend-dbtest, frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: optimus-be
            file: deploy/be.Dockerfile
            target: backend
            cache_scope: be
          - image: optimus-fe
            file: deploy/fe.Dockerfile
            target: ''
            cache_scope: fe
    env:
      DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME || github.repository_owner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
            docker.io/${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=${{ github.ref_name }}-,format=short

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: true
          load: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}
          build-args: |
            VERSION=${{ github.sha }}
